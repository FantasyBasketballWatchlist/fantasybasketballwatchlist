<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
        <defs><radialGradient id="ballg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffb46b"/><stop offset=".55" stop-color="#ff7a1a"/><stop offset="1" stop-color="#c2410c"/></radialGradient></defs>
        <circle cx="16" cy="16" r="15" fill="url(#ballg)"/>
        <g fill="none" stroke="#3a1400" stroke-width="1.4" opacity=".75">
          <path d="M16 1v30M1 16h30"/><path d="M5.5 5.5c5 4 5 17 0 21"/><path d="M26.5 5.5c-5 4-5 17 0 21"/>
        </g>
      </svg>
      <span>Hoop<em>othesis</em></span>
    </a>
    <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="true">✕ Hide</button>
    <nav class="nav" id="site-nav">
      <a href="/" class="{{ 'active' if active == 'home' }}">Rankings</a>
      <a href="/draft" class="{{ 'active' if active == 'draft' }}">Draft</a>
      <a href="/league" class="{{ 'active' if active == 'league' }}">Teams</a>
      <a href="/leagues" class="{{ 'active' if active == 'leagues' }}"><span class="nav-long">Your </span>Leagues</a>
      <a href="/trade-analyzer" class="{{ 'active' if active == 'trade' }}">Trade<span class="nav-long"> Analyzer</span></a>
      <a href="/waiver-wires" class="{{ 'active' if active == 'waiver' }}">Waiver<span class="nav-long"> Wire</span></a>
      <a href="/injuries" class="{{ 'active' if active == 'injuries' }}">Injuries</a>
      <a href="/games" class="{{ 'active' if active == 'games' }}">Games</a>
    </nav>
  </div>
  <script>
    // Phones: the menu can be hidden; the choice is remembered in this browser.
    (function () {
      const bar = document.currentScript.closest('.topbar'), btn = bar.querySelector('.nav-toggle');
      let hidden = false;
      try { hidden = localStorage.getItem('hoop-nav-hidden') === '1'; } catch (e) {}
      const apply = () => {
        bar.classList.toggle('nav-hidden', hidden);
        btn.setAttribute('aria-expanded', String(!hidden));
        btn.textContent = hidden ? '☰ Menu' : '✕ Hide';
      };
      btn.addEventListener('click', () => {
        hidden = !hidden;
        try { localStorage.setItem('hoop-nav-hidden', hidden ? '1' : '0'); } catch (e) {}
        apply();
      });
      apply();
    })();
  </script>
</header>
