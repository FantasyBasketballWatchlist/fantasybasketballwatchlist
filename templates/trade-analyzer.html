<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <style>
    .side { padding: 22px; min-height: 260px; }
    .side .search { margin: 12px 0 16px; max-width: none; }
    .side .search input { padding: 12px 16px; font-size: .98rem; }
    .roster { display: flex; flex-direction: column; gap: 8px; }
    .roster:empty::before { content: 'No players yet. Search above to add up to 8.'; color: var(--dim); font-size: .9rem; }
    .pchip {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px;
      border-radius: 12px; background: rgba(255, 255, 255, .03); border: 1px solid var(--border);
      border-left: 3px solid var(--c); animation: fadeUp .35s var(--ease) both;
    }
    .pchip b { font-weight: 600; }
    .pchip small { color: var(--dim); margin-left: 6px; }
    .pchip button { background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 1.2rem; line-height: 1; padding: 2px 6px; border-radius: 6px; }
    .pchip button:hover { color: var(--bad); background: rgba(248, 113, 113, .12); }
    .actions { text-align: center; margin: 26px 0; }
    #trade-result { padding: 26px; }
    .verdict { text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 700; text-transform: uppercase; line-height: 1.1; }
    .verdict.win { color: var(--good); }
    .verdict.lose { color: var(--bad); }
    .verdict.even { color: var(--orange-2); }
    .verdict-sub { text-align: center; color: var(--muted); margin-top: 6px; }
    .tug { margin: 22px auto 6px; max-width: 640px; }
    .tug-bar { position: relative; height: 14px; border-radius: 99px; background: rgba(248, 113, 113, .35); overflow: hidden; }
    .tug-bar i { position: absolute; inset: 0; background: linear-gradient(90deg, #059669, var(--good)); transform-origin: left; transform: scaleX(.5); transition: transform 1s var(--ease); }
    .tug-bar::after { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: rgba(255, 255, 255, .6); }
    .tug-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: .82rem; margin-top: 6px; }
    .compare { margin-top: 22px; }
    .compare .panel { padding: 18px; }
    .compare .list-row .val { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1.1rem; }
    .total { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-weight: 600; }
  </style>
</head>
<body>
  {% set active = 'trade' %}{% include '_nav.html' %}

  <main class="page">
    <section class="hero">
      <h1>Trade <span class="accent">Analyzer</span></h1>
      <p>Compared by value over replacement, so a 2-for-1 accounts for the roster spot it opens.</p>
    </section>

    <div class="grid-2">
      <div class="card side" style="--c: var(--bad)">
        <div class="panel" style="padding:0"><h3><span class="dot"></span>You give</h3></div>
        <div class="search">
          <input type="text" id="search-1" placeholder="Add a player..." autocomplete="off">
          <div id="suggest-1" class="suggestions"></div>
        </div>
        <div class="roster" id="roster-1"></div>
      </div>
      <div class="card side" style="--c: var(--good)">
        <div class="panel" style="padding:0"><h3><span class="dot"></span>You get</h3></div>
        <div class="search">
          <input type="text" id="search-2" placeholder="Add a player..." autocomplete="off">
          <div id="suggest-2" class="suggestions"></div>
        </div>
        <div class="roster" id="roster-2"></div>
      </div>
    </div>

    <div class="actions"><button class="btn" id="analyze-btn">Analyze trade</button></div>
    <section id="trade-result" class="card" hidden></section>
  </main>

  <script src="{{ url_for('static', filename='common.js') }}"></script>
  <script>
    const MAX_PLAYERS_PER_SIDE = 8;
    let activePlayers = [];
    const teams = { 1: [], 2: [] };

    async function fetchActivePlayers() {
      try {
        activePlayers = await (await fetch('/api/players')).json();
      } catch (error) {
        showResult(`<div class="verdict-sub">Could not load NBA data. Make sure app.py is running, then refresh.</div>`);
      }
    }

    function addPlayer(player, side) {
      const other = side === 1 ? 2 : 1;
      teams[other] = teams[other].filter(p => p.id !== player.id);
      if (!teams[side].some(p => p.id === player.id) && teams[side].length < MAX_PLAYERS_PER_SIDE) teams[side].push(player);
      renderRoster(1); renderRoster(2);
    }

    function renderRoster(side) {
      document.getElementById(`roster-${side}`).innerHTML = teams[side].map(p => {
        const t = tierOf(p.rank);
        return `<div class="pchip tier tier-${t.key}"><span><b>${escapeHtml(p.name)}</b><small>${escapeHtml(p.team || '')} · #${p.rank ?? '—'}</small></span>
          <span style="display:flex;align-items:center;gap:8px"><span class="badge">${t.label}</span><button data-side="${side}" data-id="${p.id}" title="Remove">×</button></span></div>`;
      }).join('');
    }

    document.addEventListener('click', e => {
      const b = e.target.closest('.pchip button');
      if (!b) return;
      const side = +b.dataset.side;
      teams[side] = teams[side].filter(p => p.id !== +b.dataset.id);
      renderRoster(side);
    });

    function showResult(html) {
      const r = document.getElementById('trade-result');
      r.innerHTML = html;
      r.hidden = false;
      r.classList.remove('fade-up'); void r.offsetWidth; r.classList.add('fade-up');
    }

    function sideHtml(title, color, side) {
      const rows = side.players.map(p => {
        const t = tierOf(p.rank);
        const v = p.value_over_replacement;
        return `<div class="list-row tier tier-${t.key}">
          <span class="who"><span class="rank-pill">${p.rank ?? '—'}</span><span><b>${escapeHtml(p.name)}</b>${p.injury_note ? ` <span class="chip inj" title="${escapeHtml(p.injury_note)}">injury</span>` : ''}<br><small>${fmt(p.bpv)} BPV</small></span></span>
          <span class="val" style="color:${v >= 0 ? 'var(--good)' : 'var(--bad)'}">${v >= 0 ? '+' : ''}${fmt(v, 2)}</span></div>`;
      }).join('');
      return `<div class="card panel" style="--c:${color}"><h3><span class="dot"></span>${title}</h3>${rows}
        <div class="total"><span>Total BPV</span><span>${fmt(side.total_bpv, 2)}</span></div>
        <div class="total" style="border:0;margin-top:0"><span>Value over replacement</span><span>${fmt(side.total_value_over_replacement, 2)}</span></div></div>`;
    }

    async function analyzeTrade() {
      const button = document.getElementById('analyze-btn');
      if (!teams[1].length || !teams[2].length) {
        showResult(`<div class="verdict-sub">Add at least one player to each side.</div>`);
        return;
      }
      button.innerHTML = '<span class="spinner"></span> Analyzing';
      button.disabled = true;
      try {
        const give = teams[1].map(p => p.id).join(',');
        const get = teams[2].map(p => p.id).join(',');
        const response = await fetch(`/api/trade?give=${give}&get=${get}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Trade analysis failed.');
        const diff = data.difference;
        const spots = data.give.players.length - data.get.players.length;
        let cls, title;
        if (Math.abs(diff) < 0.5) { cls = 'even'; title = 'About even'; }
        else if (diff > 0) { cls = 'win'; title = `You win by ${fmt(diff)}`; }
        else { cls = 'lose'; title = `You lose by ${fmt(-diff)}`; }
        const give_v = Math.max(0, data.give.total_value_over_replacement);
        const get_v = Math.max(0, data.get.total_value_over_replacement);
        const share = (give_v + get_v) > 0 ? get_v / (give_v + get_v) : 0.5;
        showResult(`
          <div class="verdict ${cls}">${title}</div>
          <div class="verdict-sub">fantasy points per game, after filling open roster spots with free agents${spots !== 0
            ? ` (you ${spots > 0 ? 'open' : 'use'} ${Math.abs(spots)} spot${Math.abs(spots) === 1 ? '' : 's'}, worth about ${fmt(data.meta.replacement_level)} FPTS/game each)` : ''}</div>
          <div class="tug"><div class="tug-bar"><i id="tug"></i></div>
            <div class="tug-labels"><span>You get</span><span>You give</span></div></div>
          <div class="grid-2 compare">${sideHtml('You give', 'var(--bad)', data.give)}${sideHtml('You get', 'var(--good)', data.get)}</div>`);
        requestAnimationFrame(() => requestAnimationFrame(() => { document.getElementById('tug').style.transform = `scaleX(${share})`; }));
      } catch (error) {
        showResult(`<div class="verdict-sub">${escapeHtml(error.message)}</div>`);
      }
      button.textContent = 'Analyze trade';
      button.disabled = false;
      document.getElementById('trade-result').scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'center' });
    }

    [1, 2].forEach(side => {
      const input = document.getElementById(`search-${side}`);
      wireAutocomplete(input, document.getElementById(`suggest-${side}`), () => activePlayers, p => {
        addPlayer(p, side);
        input.value = '';
      }, 6);
    });
    document.getElementById('analyze-btn').addEventListener('click', analyzeTrade);
    fetchActivePlayers();
  </script>
</body>
</html>
